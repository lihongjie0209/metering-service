apiVersion: v1
kind: Secret
metadata:
  name: metering-service
  namespace: platform
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=metering
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=metering
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  # Create metering-service-grpc-tls separately as a kubernetes.io/tls Secret.
