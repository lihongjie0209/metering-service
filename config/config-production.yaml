# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: false
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: metering
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths:
    - /api/v1/meters/create
    - /api/v1/meters/update
    - /api/v1/usage/record
    - /api/v1/usage/adjust
  grpc_methods:
    - /platform.metering.v1.MeteringService/CreateMeter
    - /platform.metering.v1.MeteringService/UpdateMeter
    - /platform.metering.v1.MeteringService/RecordUsage
    - /platform.metering.v1.MeteringService/AdjustUsage
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
outbound:
  grpc:
    authorization:
      target: authorization-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: authorization-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
    application:
      target: application-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: application-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
